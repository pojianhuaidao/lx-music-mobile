name: Setup
description: Setup Env

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc

    - name: Setup Java Env
      uses: actions/setup-java@v4
      with:
        distribution: 'microsoft'
        java-version: '17'
        cache: gradle

    - name: Get npm cache directory
      id: npm-cache-dir
      shell: bash
      run: echo "cachedir=$(npm config get cache)" >> ${GITHUB_OUTPUT}

    # FFmpeg 音频桥接模块（方案A）需要 NDK 与 CMake 参与原生编译
    - name: Setup Android NDK & CMake
      shell: bash
      env:
        NDK_VERSION: 26.1.10909125
        CMAKE_VERSION: 3.22.1
      run: |
        SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
        if [ -z "$SDK_ROOT" ]; then
          echo "::error::未找到 Android SDK 路径（ANDROID_SDK_ROOT / ANDROID_HOME 均为空）"
          exit 1
        fi
        echo "Android SDK: $SDK_ROOT"
        SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
        if [ ! -x "$SDKMANAGER" ]; then
          echo "::error::未找到 sdkmanager: $SDKMANAGER"
          exit 1
        fi
        yes | "$SDKMANAGER" --licenses > /dev/null || true
        "$SDKMANAGER" --install "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"
        echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
        echo "$SDK_ROOT/cmake/${CMAKE_VERSION}/bin" >> "$GITHUB_PATH"
        echo "NDK: $SDK_ROOT/ndk/${NDK_VERSION}"
        echo "CMake: $SDK_ROOT/cmake/${CMAKE_VERSION}/bin"

    - name: Cache node modules
      id: cache-npm
      uses: actions/cache@v4
      with:
        # npm cache files are stored in `~/.npm` on Linux/macOS
        path: ${{ steps.npm-cache-dir.outputs.cachedir }}
        key: ${{ runner.os }}-npm-cache-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-cache-

    - name: Install dependencies
      shell: bash
      run: npm ci
